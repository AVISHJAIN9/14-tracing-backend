services:
  - type: web
    name: aj-tracing-backend
    runtime: python
    plan: free
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install uvicorn
    startCommand: PYTHONPATH=src uvicorn api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
